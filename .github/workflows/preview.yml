# استقرارِ Preview برای شاخه‌های غیر از main (برای دیدنِ بازطراحی به‌صورت زنده).
# سایتِ اصلی دست‌نخورده می‌ماند؛ این فقط یک نسخهٔ آزمایشی روی زیردامنهٔ Vercel می‌سازد.
# از همان secretِ VERCEL_TOKEN استفاده می‌کند که قبلاً برای deploy ساختی.

name: Preview deploy

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_nAtuXbhvrGGmworR83tXxvZZ
      VERCEL_PROJECT_ID: prj_hXIRm7VOPCh9otgfbuaJuZpIpgTr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy preview
        run: |
          vercel link --yes --scope lunafortuna-s-projects --project project-8m4jg --token="$VERCEL_TOKEN" 2>&1 | tee build.log || true
          echo "--- link exit: done, deploying ---" | tee -a build.log
          vercel deploy --yes --token="$VERCEL_TOKEN" 2>&1 | tee -a build.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' build.log | tail -1)
          echo "captured url: $url"
          paste=$(tail -c 6000 build.log | curl -s --data-binary @- https://paste.rs || echo "n/a")
          # انتشارِ URL به‌صورت commit status تا بدونِ احراز هویت خوانده شود
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"preview-url\",\"target_url\":\"$url\",\"description\":\"preview + log: $paste\"}" > /dev/null
          {
            echo "## 🌙 پیش‌نمایشِ بازطراحی"
            echo "- این دیپلوی: $url"
            echo "- لاگ: $paste"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

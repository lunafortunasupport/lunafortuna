# استقرارِ Preview برای شاخه‌های غیر از main (برای دیدنِ بازطراحی به‌صورت زنده).
# سایتِ اصلی دست‌نخورده می‌ماند؛ این فقط یک نسخهٔ آزمایشی روی زیردامنهٔ Vercel می‌سازد.
# از همان secretِ VERCEL_TOKEN استفاده می‌کند که قبلاً برای deploy ساختی.

name: Preview deploy

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_nAtuXbhvrGGmworR83tXxvZZ
      VERCEL_PROJECT_ID: prj_hXIRm7VOPCh9otgfbuaJuZpIpgTr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy preview
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" 2>&1 | tee -a build.log
          vercel build --token="$VERCEL_TOKEN" 2>&1 | tee -a build.log
          vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" 2>&1 | tee -a build.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' build.log | tail -1)
          vercel alias set "$url" lunafortuna-redesign.vercel.app --token="$VERCEL_TOKEN" 2>&1 | tee -a build.log || true
          paste=$(tail -c 6000 build.log | curl -s --data-binary @- https://paste.rs || echo "n/a")
          {
            echo "## 🌙 پیش‌نمایشِ بازطراحی"
            echo "- این دیپلوی: $url"
            echo "- لینکِ ثابت: https://lunafortuna-redesign.vercel.app"
            echo "- لاگ: $paste"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
